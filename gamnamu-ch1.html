<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e2b8">
<title>감나무 아래 묻어 둔 것</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#3a2f26;background:#f6efdf;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.serif{font-family:"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
body.era-past{--bg:#fbf1d8;--bar:#f3e2b8;--ink:#4a3320;--acc:#c8483f;--acc2:#e9a23b;--chip:#fff8e4;--line:#d9c08a}
body.era-present{--bg:#eef2f0;--bar:#dde6e4;--ink:#2f3d42;--acc:#2f7f8f;--acc2:#6aa7a0;--chip:#f8fbfa;--line:#b9cbc8}

/* ── 첫 화면 ── */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#f6efdf;overflow:hidden}
#menuArt{position:absolute;inset:0;width:100%;height:100%}
#menuArt svg{position:absolute;inset:0;width:100%;height:100%}
#menu .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,250,236,.0) 0%,rgba(255,250,236,.15) 35%,rgba(255,250,236,.93) 68%)}
#menuBox{position:relative;z-index:2;width:min(92vw,620px);padding:0 0 max(18px,env(safe-area-inset-bottom));text-align:center}
#menu h1{font-size:clamp(28px,6vw,46px);margin:0;letter-spacing:-.02em;color:#4a2f1c;text-shadow:0 2px 0 #fff8e4}
#menu .sub{margin:6px 0 16px;font-size:clamp(13px,2.4vw,16px);color:#7a5f45}
#menu .sub b{color:#c8483f}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{background:#fffaf0;border:2px solid #d9c08a;border-radius:16px;padding:14px 10px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #d9c08a;transition:transform .08s}
.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d9c08a}
.mbtn small{display:block;font-weight:500;font-size:12px;color:#8a7358;margin-top:3px}
.mbtn.pri{background:#c8483f;color:#fff;border-color:#9c3229;box-shadow:0 3px 0 #9c3229}
.mbtn.pri small{color:#ffe1d6}
.mbtn.wide{grid-column:1/-1}
#ver{margin-top:10px;font-size:11px;color:#a08a6c}
#lobby{position:absolute;inset:0;z-index:5;background:rgba(58,44,34,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fffaf0;border-radius:22px;padding:22px;width:min(94vw,520px);box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
.card h2{margin:0 0 6px;font-size:21px}
.card p{margin:6px 0;font-size:14px;line-height:1.55;color:#6a5846}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.role{border-radius:16px;padding:12px 8px;border:3px solid transparent;background:#fbf1d8;font-weight:700}
.role.d{background:#e3edeb}
.role .pt{width:74px;height:74px;margin:0 auto 6px;border-radius:16px;overflow:hidden}
.role small{display:block;font-weight:500;font-size:12px;color:#7a6a5a;margin-top:2px}
.role.on{border-color:#c8483f}
.role.d.on{border-color:#2f7f8f}
.code{font-size:46px;font-weight:800;letter-spacing:.18em;color:#c8483f;margin:8px 0;font-variant-numeric:tabular-nums}
#codeIn{font:inherit;font-size:36px;font-weight:800;letter-spacing:.2em;text-align:center;width:220px;padding:8px;border-radius:14px;border:2px solid #d9c08a;background:#fff}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{background:#c8483f;color:#fff;border-radius:14px;padding:12px 22px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #9c3229}
.btn.ghost{background:#efe3c6;color:#5a4630;box-shadow:0 3px 0 #d9c08a}
.btn:disabled{opacity:.45}
.spin{display:inline-block;width:14px;height:14px;border:3px solid #d9c08a;border-top-color:#c8483f;border-radius:50%;animation:spin .9s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 게임 화면 ── */
#game{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
#top{display:flex;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));background:var(--bar);border-bottom:2px solid var(--line);min-height:50px}
#era{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
#era b{font-size:24px;font-weight:800;color:var(--acc);letter-spacing:-.02em}
#era span{font-size:12px;opacity:.75}
#tabs{display:flex;gap:6px;margin-left:6px;flex:1;min-width:0}
.tab{background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab.lock{opacity:.45}
#wellcnt{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap}
#wellcnt i{width:11px;height:11px;border-radius:50%;background:var(--acc2);display:inline-block}
#wellcnt i.off{background:transparent;border:2px solid var(--line)}
.ib{background:var(--chip);border:2px solid var(--line);border-radius:12px;height:38px;min-width:38px;padding:0 10px;font-weight:700;font-size:13px;white-space:nowrap}
.ib.swap{background:var(--acc);color:#fff;border-color:var(--acc)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scene{width:100%;height:100%;display:block;transition:opacity .18s}
#scene.fade{opacity:0}
.hs{fill:transparent;cursor:pointer}
.mk{pointer-events:none;fill:#fff;opacity:.0}
body.marks .mk{opacity:.85;animation:mk 2.2s ease-in-out infinite}
.mk.trace{fill:#ffd24a}
.mk.door{fill:#fff}
@keyframes mk{0%,100%{r:4;opacity:.25}50%{r:7;opacity:.9}}
.lab{pointer-events:none;font-size:17px;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(40,30,20,.75);stroke-width:5px;stroke-linejoin:round}
.sway{transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.sway2{transform-box:fill-box;transform-origin:50% 100%;animation:sway2 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(.7deg)}}
@keyframes sway2{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.drift{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.smoke{animation:smoke 5s ease-in-out infinite}
@keyframes smoke{0%{transform:translate(0,6px);opacity:.2}50%{opacity:.9}100%{transform:translate(14px,-14px);opacity:0}}
.glint{animation:glint 3s ease-in-out infinite}
@keyframes glint{50%{opacity:.75}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.tw{animation:tw 1s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.peck{animation:peck 2.8s ease-in-out infinite}
@keyframes peck{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(9deg)}90%{transform:rotate(-2deg)}}
.tapfx{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:tapfx .45s ease-out forwards}
@keyframes tapfx{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}
#ripple{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ripple i{position:absolute;width:40vmax;height:40vmax;border-radius:50%;border:6px solid rgba(255,255,255,.9);animation:rip 1.5s ease-out forwards}
#ripple i:nth-child(2){animation-delay:.22s}#ripple i:nth-child(3){animation-delay:.44s}
#ripple b{position:relative;font-size:clamp(18px,3.4vw,28px);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55);animation:ript 2.2s ease forwards;letter-spacing:.08em}
@keyframes rip{from{transform:scale(0);opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes ript{0%{opacity:0;transform:scale(.9)}20%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}
#echo{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(74,51,32,.82);color:#fff3d0;padding:6px 16px;border-radius:999px;font-size:13px;pointer-events:none;animation:echo 2.4s ease forwards;white-space:nowrap}
@keyframes echo{0%{opacity:0;transform:translate(-50%,-8px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#msg{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:10px;align-items:center;background:rgba(255,252,243,.96);border:2px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 4px 14px rgba(0,0,0,.12);animation:msgin .2s ease;z-index:3}
#msg .pt{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}
#msg p{margin:0;font-size:clamp(14px,2.1vw,17px);line-height:1.45;color:#3a2f26}
@keyframes msgin{from{transform:translateY(8px);opacity:0}}
#part{position:absolute;top:8px;right:10px;background:rgba(255,252,243,.9);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;z-index:2}
#part.off{background:#c8483f;color:#fff;border-color:#9c3229}
#bot{background:var(--bar);border-top:2px solid var(--line);padding:6px max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;gap:8px;align-items:center;min-height:78px}
#bag{display:flex;gap:7px;flex:1;overflow-x:auto;padding:2px}
.slot{position:relative;flex:none;width:68px;height:64px;background:var(--chip);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px}
.slot svg{width:36px;height:36px}
.slot span{font-size:10.5px;font-weight:700;line-height:1.1;text-align:center;max-width:64px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot.on{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px var(--acc);transform:translateY(-3px)}
.slot.new{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}}
.slot .un{position:absolute;top:-8px;right:-8px;background:var(--acc);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:3px 7px}
#bagEmpty{font-size:13px;opacity:.6;padding-left:6px}

/* ── 겹침 화면 ── */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
#cut{align-items:flex-end;background:linear-gradient(180deg,rgba(30,22,16,.12),rgba(30,22,16,.5));padding:0 12px max(12px,env(safe-area-inset-bottom))}
#cutBox{width:min(100%,860px);background:#fffaf0;border:3px solid #d9c08a;border-radius:22px;padding:14px 16px 12px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 10px 40px rgba(0,0,0,.3);min-height:150px;position:relative}
#cutBox.D{background:#f4f8f7;border-color:#a9c4c0}
#cutBox .pt{width:96px;height:96px;border-radius:18px;overflow:hidden;flex:none}
#cutBody{flex:1;min-width:0}
#cutName{font-weight:800;font-size:14px;margin-bottom:4px;color:#c8483f}
#cutBox.D #cutName{color:#2f7f8f}
#cutText{font-size:clamp(17px,2.7vw,22px);line-height:1.55;white-space:pre-wrap;min-height:3.1em;word-break:keep-all}
#cutBox.N{background:rgba(40,30,22,.9);border-color:#6a5846;color:#fff3d6;text-align:center}
#cutBox.N #cutText{font-style:normal}
#cutBox.R{background:#fff7dc;border:4px double #c99a36;text-align:center}
#cutBox.R #cutName{color:#a8771e;letter-spacing:.2em}
#cutBox.F{background:#f1e6c8;border-color:#b79c5a;background-image:repeating-linear-gradient(transparent 0 33px,rgba(120,90,40,.18) 33px 34px)}
#cutBox.F #cutName{color:#7a5a2a}
#cutBox.F #cutText{font-family:"Nanum Pen Script","Noto Serif KR","Batang",serif;color:#3b2c18}
#cutBox.big #cutText{font-size:clamp(22px,3.8vw,32px);font-weight:800}
#cutBox.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(1.18) rotate(-1deg)}40%{transform:scale(.97) rotate(.6deg)}100%{transform:none}}
#app.shake{animation:shake .35s linear}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
#cutFoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px}
.lamps{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;opacity:.8}
.lamp{width:12px;height:12px;border-radius:50%;border:2px solid #b9a781;background:transparent}
.lamp.on{background:#6fb25a;border-color:#4f9644}
#cutAck{background:#c8483f;color:#fff;border-radius:12px;padding:10px 20px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #9c3229}
#cutBox.D #cutAck{background:#2f7f8f;box-shadow:0 3px 0 #1f5f6c}
#cutAck:disabled{opacity:.35}
#cutAck.wait{background:#b9a781;box-shadow:none}
#read{background:#2b211a;color:#fff3d6;flex-direction:column;padding:24px;text-align:center}
#read.d{background:#1f2c30;color:#e6f1ef}
#readText{font-size:clamp(19px,3.4vw,27px);line-height:1.8;white-space:pre-wrap;max-width:720px;min-height:7em;display:flex;align-items:center;justify-content:center;animation:fadein .7s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
#readNext{margin-top:22px;background:transparent;border:2px solid currentColor;color:inherit;border-radius:999px;padding:10px 28px;font-weight:700;font-size:15px;transition:opacity .4s}
#readNext:disabled{opacity:.15}
#readDots{margin-top:14px;display:flex;gap:6px}
#readDots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25}
#readDots i.on{opacity:.9}
#zoom,#choice,#sync,#end,#pause{background:rgba(30,22,16,.6);padding:14px;flex-direction:column}
#zoomBox{background:#fffaf0;border-radius:20px;padding:12px;width:min(96vw,860px);max-height:92%;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#zoomBox svg{width:100%;max-height:66vh;border-radius:12px;display:block}
#zoomCap{font-size:15px;text-align:center;color:#5a4630;line-height:1.5}
.choices{display:grid;gap:10px;margin-top:12px}
.choices button{background:#fbf1d8;border:2px solid #d9c08a;border-radius:14px;padding:14px;font-size:17px;font-weight:700}
#syncBox{background:#fffaf0;border-radius:24px;padding:18px 22px;width:min(94vw,460px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#syncBox h3{margin:0 0 4px;font-size:19px}
#syncBox p{margin:0 0 10px;font-size:13.5px;color:#6a5846;line-height:1.5}
#hold{position:relative;width:150px;height:150px;border-radius:50%;background:#c8483f;color:#fff;font-weight:800;font-size:19px;box-shadow:0 6px 0 #9c3229;margin:6px auto 10px;display:flex;align-items:center;justify-content:center;touch-action:none}
#hold.down{transform:translateY(4px);box-shadow:0 2px 0 #9c3229;background:#a83a32}
#hold svg{position:absolute;inset:-12px;width:174px;height:174px;transform:rotate(-90deg)}
#hold circle{fill:none;stroke:#e9a23b;stroke-width:9;stroke-linecap:round;stroke-dasharray:509;stroke-dashoffset:509}
#hold.go circle{transition:stroke-dashoffset 1.6s linear;stroke-dashoffset:0}
.who{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:700;margin-bottom:8px}
.who span{display:flex;align-items:center;gap:6px}
#flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:flash .7s ease forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
#endBox{background:#fffaf0;border-radius:24px;padding:24px;width:min(94vw,560px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#endBox h2{margin:0;font-size:26px}
#endBox .st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;text-align:left}
#endBox .st div{background:#fbf1d8;border-radius:12px;padding:10px 12px;font-size:13px}
#endBox .st b{display:block;font-size:19px;color:#c8483f}
#rot{position:absolute;inset:0;z-index:90;background:#2b211a;color:#fff3d6;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.7;padding:24px}
@media (orientation:portrait) and (max-width:600px){#rot.want{display:flex}}
@media (max-height:520px){#menu .veil{background:linear-gradient(180deg,rgba(255,250,236,.55) 0%,rgba(255,250,236,.92) 45%)}#bot{min-height:62px}.slot{height:54px;width:60px}.slot svg{width:28px;height:28px}#cutBox .pt{width:72px;height:72px}#cutBox{min-height:120px}#top{min-height:44px}}
@media (prefers-reduced-motion:reduce){.sway,.sway2,.drift,.bob,.peck,.smoke{animation:none}}

#chSel{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 10px;font-size:12.5px;color:#7a5f45}
.chb{background:#fffaf0;border:2px solid #d9c08a;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px}
.chb.on{background:#4a2f1c;border-color:#4a2f1c;color:#fff6dc}
.stepmk{pointer-events:none;fill:#fff;opacity:.55;animation:stepmk 1.8s ease-in-out infinite}
@keyframes stepmk{50%{opacity:.15}}
#zoomSvg{overflow:auto}

#chSel b{font-size:13.5px;color:#4a2f1c;margin-left:4px}
.chb{padding:6px 10px}
#syncDots{display:flex;gap:8px;justify-content:center;margin:2px 0 8px}
#syncDots i{width:18px;height:18px;border-radius:50%;border:3px solid #d9c08a}
#syncDots i.on{background:#e9a23b;border-color:#c98a1e}
#hold.bell{border-radius:28px;width:200px;height:110px}
#hold.bell svg{display:none}
.spin0{animation:spin 6s linear infinite}
.spin1{animation:spin 6s linear infinite reverse}
.pendrun{animation:pend 2s ease-in-out infinite}
@keyframes pend{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
.minrun{animation:spin 60s linear infinite}
.flow{animation:flow 1.1s linear infinite}
@keyframes flow{from{transform:translateY(-20px);opacity:0}30%{opacity:1}to{transform:translateY(30px);opacity:0}}

#cutBox.R #cutText{font-size:clamp(14.5px,2.1vw,18px);line-height:1.6;max-height:52vh;overflow:auto;text-align:left;animation:fadein .5s ease}

#cutBox.R #cutText{font-size:clamp(14px,2vw,17px);line-height:1.55;max-height:calc(100vh - 200px);overflow-y:auto;scrollbar-width:thin}
@media (max-height:520px){#cutBox.R #cutText{font-size:12.5px;line-height:1.45;max-height:calc(100vh - 150px)}}
</style>
</head>
<body class="era-past marks">
<div id="app">
  <section id="menu">
    <div id="menuArt"></div><div class="veil"></div>
    <div id="menuBox">
      <h1 class="serif">감나무 아래 묻어 둔 것</h1>
      <p class="sub">같은 집, 오십 년의 간격. <b>둘이서</b> 푸는 협동 퍼즐</p>
      <div id="chSel"></div>
      <div class="mbtns">
        <button class="mbtn pri wide" id="mResume" hidden>이어하기<small id="mResumeInfo"></small></button>
        <button class="mbtn pri" id="mHost">방 만들기<small>기기 두 대 · 내가 먼저</small></button>
        <button class="mbtn pri" id="mJoin">방 들어가기<small>기기 두 대 · 번호 입력</small></button>
        <button class="mbtn" id="mSolo">한 기기로 살펴보기<small>시대를 번갈아 조작</small></button>
        <button class="mbtn" id="mFull">전체 화면<small>가로로 돌려서 하세요</small></button>
      </div>
      <div id="ver">v1.0.0 · 1장 「낡은 집」</div>
    </div>
    <div id="lobby" hidden><div class="card" id="lobbyCard"></div></div>
  </section>

  <section id="game" hidden>
    <header id="top">
      <div id="era"><b></b><span></span></div>
      <nav id="tabs"></nav>
      <div id="wellcnt" hidden></div>
      <button class="ib swap" id="bSwap" hidden>시대 전환</button>
      <button class="ib" id="bHint">혼잣말</button>

  function cutDone(S, id, ev) {
    if (id === 'finale') { S.end = true; ev.push({ k: 'end' }); }
  }

  /* ── 행동 처리 ── */
  function act(S, role, a) {
    var ev = [];
    S.n++;
    function say(key, arg) {
      var t = T[key]; if (typeof t === 'function') t = t(arg);
      if (t == null) throw new Error('no text ' + key);

    }
    function sayTo(to, key) { ev.push({ k: 'say', to: to, t: T[key] }); }
    function fx(name, to) { ev.push({ k: 'fx', name: name, to: to || role }); }

    if (a.t === 'intro') { S.intro[role] = true; if (a.both) { S.intro.past = S.intro.present = true; } return ev; }

    if (a.t === 'ack') {
      if (!S.cut) return ev;

      if (S.cut.ack.past && S.cut.ack.present) {

        if (S.cut.i >= CUTS[S.cut.id].length) {
          var done = S.cut.id; S.cut = null;
          cutDone(S, done, ev);
          if (S.cq.length) S.cut = { id: S.cq.shift(), i: 0, ack: {} };
        }
      }
      return ev;
    }
    if (a.t === 'hold') {
      if (!S.sync) return ev;
      S.sync.hold[role] = !!a.on; if (a.both) { S.sync.hold.past = S.sync.hold.present = !!a.on; }

    if (a.t === 'syncDone') {
      if (!S.sync || !S.sync.hold.past || !S.sync.hold.present) return ev;

        ev.push({ k: 'say', to: 'present', t: T.d_sent }); ev.push({ k: 'say', to: 'past', t: T.p_arrive });
        ev.push({ k: 'fx', name: 'sent', to: 'both' });

      } else if (sy.k === 'photo') {
        S.photo = true; ev.push({ k: 'fx', name: 'shutter', to: 'both' }); cutq(S, 'finale');
      }

    }

    if (S.cut || S.sync) return ev;   // 장면 중엔 조작 불가
    if (S.end && a.t !== 'go') return ev;   // 끝난 뒤엔 둘러보기만
    var sigBefore = presSig(S);

    if (a.t === 'go') {
      if (areasOf(S, role).indexOf(a.area) >= 0) { S.area[role] = a.area; fx('go'); }
    } else if (a.t === 'tap') {

    function take(x, key) { S.it[x] = role === 'past' ? 'B' : 'P'; say(key); fx('take'); }

  /* ── 다음에 해야 할 일(힌트와 자동 검증이 함께 쓴다) ── */
  function next(S) {

    }
    if (S.proof === 0) return at(P, 'yard', st(P, tap('step'), '증거를 대기로 했다. 댓돌에.', '마당의 댓돌을 눌러 금을 긋자.', '막내가 댓돌에 금을 긋기를 기다리자.'));
    if (S.proof === 1) return at(D, 'yard', st(D, tap('step'), '오십 년 전에 그은 금이 남아 있을까.', '마당의 댓돌을 확인하자.', '다온이 댓돌을 확인하기를 기다리자.'));

    if (!S.shedOpen) {

        return needShovel(at(P, 'yard', st(P, tap('plant_shed'), '오십 년 뒤, 헛간 옆 감나무가 헛간을 망가뜨린다고 한다.', '헛간 옆 묘목을 삽으로 도로 파내자.', '헛간 옆에 심은 나무가 문제다. 막내에게 옮겨 달라고 하자.')));
      var ks = keySpot(S);

    lobby('<h2>방 ' + c + '</h2><p id="lbS"><span class="spin"></span>연결하는 중…</p><div class="row"><button class="btn ghost" id="lbX">취소</button></div>');
    $('lbX').onclick = function () { stopNet(); mode = null; $('lobby').hidden = true; };
    net = makeNet(false, c, {
      onOpen: function () { },
      onPeer: function () { linkUp = true; lastSeen = Date.now(); net.send({ t: 'hello' }); startPing(); if (started) renderPart(); },
      onMsg: onMsg,
      onDown: function () { linkUp = false; if (started) renderPart(); },
      onErr: function (e) { if (!started) { var el = $('lbS'); if (el) el.textContent = errText(e); } }
    });
  }

  menuArt(); menuInit();
  window.__gn = { get S() { return S; }, get me() { return me; }, get mode() { return mode; }, dispatch: dispatch, get L() { return C().L; } };
})();
